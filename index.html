<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments">
      <li class="comment">
        <div class="comment-header">
          <div>Глеб Фокин</div>
          <div>12.02.22 12:18</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            Это будет первый комментарий на этой странице
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">3</span>
            <button class="like-button"></button>
          </div>
        </div>
      </li>
      <li class="comment">
        <div class="comment-header">
          <div>Варвара Н.</div>
          <div>13.02.22 19:22</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            Мне нравится как оформлена эта страница! ❤
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">75</span>
            <button class="like-button -active-like"></button>
          </div>
        </div>
      </li>
    </ul>

    <!-- Индикатор ответа (изначально скрыт) -->
    <div id="reply-indicator" class="reply-indicator" style="display: none;">
      <span id="reply-text">Ответ на комментарий</span>
      <button id="cancel-reply" class="cancel-reply-btn">×</button>
    </div>


    <div class="add-form">
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Написать</button>
      </div>
    </div>
  </div>
</body>

<script>
  "use strict";

  // Исходные комментарии
  const initialComments = [
    {
      id: 1,
      name: "Глеб Фокин",
      date: "12.02.22 12:18",
      text: "Это будет первый комментарий на этой странице",
      likes: 3,
      isLiked: false
    },
    {
      id: 2,
      name: "Варвара Н.",
      date: "13.02.22 19:22",
      text: "Мне нравится как оформлена эта страница! ❤",
      likes: 75,
      isLiked: true
    }
  ];

  // Состояние приложения
  let comments = [...initialComments];
  let replyingTo = null;
  let nextId = 3;

  // Получаем элементы DOM
  const commentsContainer = document.querySelector('.comments');
  const replyIndicator = document.getElementById('reply-indicator');
  const replyText = document.getElementById('reply-text');
  const cancelReplyBtn = document.getElementById('cancel-reply');
  const addButton = document.querySelector('.add-form-button');
  const nameInput = document.querySelector('.add-form-name');
  const textInput = document.querySelector('.add-form-text');

  // 1. Функция для экранирования HTML
  function sanitizeHTML(text) {
    if (!text) return '';

    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // 2. Функция для форматирования текущей даты
  function formatDate() {
    const now = new Date();
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = String(now.getFullYear()).slice(-2);
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');

    return `${day}.${month}.${year} ${hours}:${minutes}`;
  }

  // 3. Функция для создания HTML комментария
  function createCommentHTML(comment) {
    const likeClass = comment.isLiked ? '-active-like' : '';

    return `
        <li class="comment" data-id="${comment.id}">
          <div class="comment-header">
            <div>${comment.name}</div>
            <div>${comment.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${comment.text}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${comment.likes}</span>
              <button class="like-button ${likeClass}"></button>
            </div>
          </div>
        </li>
      `;
  }

  // 4. Функция для отрисовки всех комментариев
  function renderComments() {
    commentsContainer.innerHTML = '';

    comments.forEach((comment) => {
      const commentHTML = createCommentHTML(comment);
      commentsContainer.insertAdjacentHTML('beforeend', commentHTML);
    });

    // Добавляем обработчики событий для кнопок лайков
    document.querySelectorAll('.like-button').forEach((button) => {
      const commentElement = button.closest('.comment');
      const commentId = parseInt(commentElement.dataset.id);

      button.addEventListener('click', (e) => {
        e.stopPropagation(); // Предотвращаем всплытие
        toggleLike(commentId);
      });
    });

    // Добавляем обработчики для ответа на комментарии
    document.querySelectorAll('.comment').forEach((commentElement) => {
      commentElement.addEventListener('click', (event) => {
        // Не запускаем ответ при клике на лайк
        if (event.target.closest('.likes')) {
          return;
        }

        const commentId = parseInt(commentElement.dataset.id);
        const comment = comments.find(c => c.id === commentId);

        if (comment) {
          setupReply(comment);
        }
      });
    });
  }

  // 5. Функция для настройки ответа на комментарий
  function setupReply(comment) {
    // Сохраняем информацию о комментарии, на который отвечаем
    replyingTo = {
      id: comment.id,
      name: comment.name,
      text: comment.text
    };

    // Подставляем имя автора, если поле пустое
    if (!nameInput.value.trim()) {
      nameInput.value = comment.name;
    }

    // Подставляем текст с упоминанием автора
    const replyPrefix = `@${comment.name}: ${comment.text}\n\n`;
    textInput.value = replyPrefix + textInput.value;

    // Фокусируемся на текстовом поле
    textInput.focus();
    textInput.setSelectionRange(replyPrefix.length, replyPrefix.length);

    // Показываем индикатор ответа
    showReplyIndicator(comment.name);
  }

  // 6. Функция для отображения индикатора ответа
  function showReplyIndicator(authorName) {
    replyText.textContent = `Ответ на комментарий ${authorName}`;
    replyIndicator.style.display = 'flex';

    // Прокручиваем к форме
    document.querySelector('.add-form').scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });
  }

  // 7. Функция для отмены ответа
  function cancelReply() {
    replyingTo = null;
    replyIndicator.style.display = 'none';
  }

  // 8. Функция для добавления лайка
  function toggleLike(commentId) {
    const commentIndex = comments.findIndex(c => c.id === commentId);

    if (commentIndex === -1) return;

    if (comments[commentIndex].isLiked) {
      comments[commentIndex].likes -= 1;
    } else {
      comments[commentIndex].likes += 1;
    }
    comments[commentIndex].isLiked = !comments[commentIndex].isLiked;
    renderComments();
  }

  // 9. Функция для добавления нового комментария
  function addComment(name, text) {
    // Проверяем заполнение полей
    if (!name.trim() || !text.trim()) {
      alert('Пожалуйста, заполните все поля');
      return;
    }

    // Очищаем HTML из ввода
    const safeName = sanitizeHTML(name.trim());
    const safeText = sanitizeHTML(text.trim());

    // Убираем префикс ответа, если он есть
    let finalText = safeText;
    if (replyingTo) {
      // Удаляем строку с упоминанием из начала текста
      const replyPrefix = `@${replyingTo.name}: ${replyingTo.text}\n\n`;
      if (safeText.startsWith(replyPrefix)) {
        finalText = safeText.slice(replyPrefix.length);
      }
    }

    // Создаем новый комментарий
    const newComment = {
      id: nextId++,
      name: safeName,
      date: formatDate(),
      text: finalText,
      likes: 0,
      isLiked: false
    };

    // Добавляем комментарий в массив
    comments.push(newComment);

    // Очищаем форму
    nameInput.value = '';
    textInput.value = '';

    // Сбрасываем режим ответа
    cancelReply();

    // Обновляем отображение
    renderComments();

    // Прокручиваем к новому комментарию
    setTimeout(() => {
      const newCommentElement = document.querySelector(`[data-id="${newComment.id}"]`);
      if (newCommentElement) {
        newCommentElement.scrollIntoView({ behavior: 'smooth' });
      }
    }, 100);
  }

  // 10. Инициализация при загрузке страницы
  function init() {
    renderComments();

    // Проверяем, существует ли элемент перед добавлением обработчика
    if (cancelReplyBtn) {
      cancelReplyBtn.addEventListener('click', cancelReply);
    } else {
      console.error('Элемент cancel-reply не найден');
    }

    if (addButton) {
      addButton.addEventListener('click', () => {
        addComment(nameInput.value, textInput.value);
      });
    }

    // Добавляем возможность отправки по Enter (Shift+Enter для новой строки)
    if (textInput) {
      textInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          addComment(nameInput.value, textInput.value);
        }
      });

      // Добавляем возможность отправки по Ctrl+Enter
      textInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && event.ctrlKey) {
          event.preventDefault();
          addComment(nameInput.value, textInput.value);
        }
      });
    }
  }

  // Запускаем инициализацию когда DOM полностью загружен
  document.addEventListener('DOMContentLoaded', init);

  console.log("It works!");


</script>

</html>
